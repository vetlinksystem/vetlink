<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Client • My Pets</title>
  <link rel="icon" type="image/png" href="/logo.png"/>
  <link href="/client/css/core.css" rel="stylesheet"/>
  <link href="/client/css/pets.css" rel="stylesheet"/>
</head>
<body data-page="#pets">
  <div id="scrim"></div>

  <div class="shell">
    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div class="brand">
        <div class="logo">🐾</div>
        <div><strong>VetLink</strong><br/><small>Client Portal</small></div>
      </div>
      <nav class="nav">
        <a href="/client/dashboard"    data-page="#dashboard">Dashboard</a>
        <a href="/client/pets"         data-page="#pets" class="active">My Pets</a>
        <a href="/client/breeding"     data-page="#breeding">Breeding</a>
        <a href="/client/chats"        data-page="#chats">Messages</a>
        <a href="/client/appointments" data-page="#appointments">Appointments</a>
        <a href="/client/records"      data-page="#records">Records</a>
        <a href="/client/profile"      data-page="#profile">Profile</a>

        <div style="padding:.75rem;margin-top:.75rem">
          <button class="btn secondary" id="logoutBtn">Log out</button>
        </div>
      </nav>
    </aside>

    <!-- MAIN -->
    <div>
      <header class="top">
        <div class="search">
          🔍
          <input
            class="input"
            id="searchBox"
            placeholder="Search pets…"
            style="background:transparent;border:none;padding:0"
          />
        </div>
        <div style="display:flex;align-items:center;gap:.5rem"><div class="chip">
            Logged in as
            <strong id="accountName" style="margin-left:.35rem">Client</strong>
          </div>
        </div>
      </header>

      <main>
        <div style="display:flex;justify-content:space-between;align-items:end;gap:.75rem;flex-wrap:wrap">
          <div>
            <h2 style="margin:0">My Pets</h2>
            <small style="color:var(--muted)">Manage profiles, vaccines, and breeding preference.</small>
          </div>
          <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
            <!-- Species filter (used by pets.js as #filterSpecies).
                 The clinic is dogs only, so pets.js repopulates this from the species
                 actually present — normally just "Dog", plus anything legacy. -->
            <select class="input" id="filterSpecies" style="width:160px">
              <option value="">All species</option>
            </select>

            <!-- Sex filter (new, used by pets.js as #filterSex) -->
            <select class="input" id="filterSex" style="width:120px">
              <option value="">All</option>
              <option>Male</option>
              <option>Female</option>
            </select>

            <!-- Breeding filter (checkbox, used by pets.js as #onlyBreedable) -->
            <label style="display:flex;align-items:center;gap:.35rem;font-size:.85rem">
              <input type="checkbox" id="onlyBreedable"/>
              <span>Breeding allowed only</span>
            </label>

            <!-- Add pet button (UI only for now) -->
            <button class="btn" id="addPetBtn">➕ Add pet</button>
          </div>
        </div>

        <!-- Summary pills row (pets.js: #petsSummary) -->
        <div id="petsSummary" class="summary-row" style="margin-top:.75rem;display:flex;gap:.5rem;flex-wrap:wrap"></div>

        <!-- Pets grid (pets.js: #petsGrid) -->
        <div id="petsGrid" class="pets-grid" style="margin-top:.75rem">
          <!-- Filled by /client/js/pets.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- Add/Edit Pet Modal (kept for later wiring) -->
  <div class="modal" id="petModal" role="dialog" aria-modal="true">
    <div class="panel">
      <header>
        <strong id="petModalTitle">Add Pet</strong>
        <button class="btn ghost" data-close>✖</button>
      </header>
      <div class="content">
        <div class="form-grid" style="display:grid;gap:1rem;grid-template-columns:repeat(2,1fr)">
          <label style="grid-column:span 2">
            <span>Pet Name <b class="req">*</b></span>
            <input class="input" id="pName" placeholder="e.g. Buddy"/>
          </label>

          <!-- Species is no longer asked for: the server derives it from the breed. -->
          <label>
            <span>Breed <b class="req">*</b></span>
            <select class="input" id="pBreed">
              <option value="">Select breed…</option>
            </select>
          </label>

          <label>
            <span>Sex <b class="req">*</b></span>
            <select class="input" id="pSex">
              <option value="">Select sex…</option>
              <option>Male</option>
              <option>Female</option>
            </select>
          </label>

          <label style="grid-column:span 2;display:none" id="pBreedOtherWrap">
            <span>Specify breed <b class="req">*</b></span>
            <input class="input" id="pBreedOther" placeholder="Type the breed"/>
          </label>

          <label>
            <span>Size <b class="req">*</b></span>
            <select class="input" id="pSize">
              <option value="">Select size…</option>
              <option value="small">Small</option>
              <option value="medium">Medium</option>
              <option value="large">Large</option>
            </select>
          </label>

          <label>
            <span>Weight (kg) <b class="req">*</b></span>
            <input class="input" id="pWeight" type="number" min="0" step="0.1" placeholder="e.g. 28"/>
          </label>

          <label>
            <span>Age <b class="req">*</b></span>
            <input class="input" id="pAgeMonths" type="number" min="0" placeholder="Age"/>
          </label>

          <label>
            <span>Age unit</span>
            <select class="input" id="pAgeUnit">
              <option value="months">Months</option>
              <option value="years">Years</option>
            </select>
          </label>

          <label class="breeding col-2" style="grid-column:span 2;display:flex;align-items:center;gap:.6rem">
            <input type="checkbox" id="pBreeding" />
            <span>Allow this pet for breeding</span>
          </label>

          <!-- Shown only when breeding is enabled -->
          <div id="pBreedingBox" class="breeding-box" style="grid-column:span 2;display:none">
            <div class="breeding-note" id="pBreedingAgeNote"></div>

            <label>
              <span>Breeding Type <b class="req">*</b></span>
              <select class="input" id="pBreedingType">
                <option value="">Choose type…</option>
                <option value="purebred">Purebred — parents are the same breed</option>
                <option value="crossbreed">Crossbreed — parents are different breeds</option>
              </select>
            </label>

            <div id="pCrossbreedFields" style="display:none">
              <label>
                <span>Purpose of breeding <b class="req">*</b></span>
                <select class="input" id="pBreedingPurpose">
                  <option value="">Choose purpose…</option>
                  <option value="companion">Companion</option>
                  <option value="working">Working</option>
                  <option value="show">Show</option>
                  <option value="guard">Guard</option>
                  <option value="therapy">Therapy</option>
                  <option value="other">Other</option>
                </select>
              </label>

              <label>
                <span>Preferred size of mate</span>
                <select class="input" id="pPreferredSize">
                  <option value="">No preference</option>
                  <option value="small">Small</option>
                  <option value="medium">Medium</option>
                  <option value="large">Large</option>
                </select>
              </label>
            </div>
          </div>

          <label style="grid-column:span 2">
            <span>Describe your pet <b class="req">*</b></span>
            <textarea
              class="input"
              id="pDescription"
              placeholder="Colour, markings, personality, anything the clinic should know…"
              rows="3"
            ></textarea>
          </label>

          <div class="col-2" style="grid-column:span 2;display:flex;gap:.5rem;justify-content:flex-end">
            <button class="btn ghost" data-close>Cancel</button>
            <button class="btn" id="pSubmit">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Saved!</div>

  <script src="/client/js/core.js"></script>
  <script src="/client/js/pets.js"></script>
</body>
</html>
